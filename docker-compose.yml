services:
  drawio:
    image: jgraph/drawio:32.6.1@sha256:3d0a5a5ffb4f76abcecd9d17ae1373e3eefd0db07b657c545637dc9c6a7412e1
    environment:
      DRAWIO_SERVER_URL: /drawio/
      JAVA_OPTS: -Xms64m -Xmx384m
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/drawio/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ajust/web dev"
    env_file:
      - .env.example
      - .env
    environment:
      CI: "true"
      PORT: ${INTERNAL_WEB_PORT:-3000}
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://worker:3002}
      API_BASE_URL: ${PUBLIC_APP_URL:-http://localhost:${API_PORT:-8071}}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_APP_URL:-http://localhost:${API_PORT:-8071}}
    volumes:
      - ./:/workspace
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8070}:${INTERNAL_WEB_PORT:-3000}"
    depends_on:
      - api
      - drawio
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  api:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ajust/api dev"
    env_file:
      - .env.example
      - .env
    environment:
      CI: "true"
      PORT: ${INTERNAL_API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ajust}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-ajust_erp}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/workspace/uploads}
      IXC_WEBHOOK_REQUIRE_SIGNATURE: ${IXC_WEBHOOK_REQUIRE_SIGNATURE:-true}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?defina SECRETS_ENCRYPTION_KEY no .env}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ajust-api
    volumes:
      - ./:/workspace
      - ./uploads:${UPLOAD_ROOT:-/workspace/uploads}
    ports:
      - "127.0.0.1:${API_PORT:-8071}:${INTERNAL_API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/monitoring/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ajust/worker dev"
    env_file:
      - .env.example
      - .env
    environment:
      CI: "true"
      PORT: ${INTERNAL_WORKER_PORT:-3002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ajust}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-ajust_erp}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379
      IXC_RECONCILE_INTERVAL_MS: ${IXC_RECONCILE_INTERVAL_MS:-300000}
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
      EXPORT_RETENTION_INTERVAL_MS: ${EXPORT_RETENTION_INTERVAL_MS:-3600000}
      IXC_MOCK_RECONCILE: ${IXC_MOCK_RECONCILE:-true}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?defina SECRETS_ENCRYPTION_KEY no .env}
    volumes:
      - ./:/workspace
    ports:
      - "127.0.0.1:${WORKER_PORT:-8076}:${INTERNAL_WORKER_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ajust_erp}
      POSTGRES_USER: ${POSTGRES_USER:-ajust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-8072}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ajust} -d ${POSTGRES_DB:-ajust_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}" --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction --appendonly yes --save 60 1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-8073}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  # pgAdmin removido em 04/11/2026 (auditoria C-046). Para acessar o banco use um túnel SSH:
  #   ssh -L 8072:127.0.0.1:8072 app@168.194.13.18   e conecte em localhost:8072.

  # Centralized log aggregation — accessible at http://localhost:3100
  # Connect Grafana to http://loki:3100 as a Loki datasource to query logs.
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
  redis_data:
