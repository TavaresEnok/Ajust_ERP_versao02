name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the validated image to production
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Upload validated staging configuration and scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: 'docker-compose.staging.yml,scripts/deploy-images.sh,scripts/db-backup.sh'
          target: ${{ secrets.STAGING_DEPLOY_PATH }}

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}
            DEPLOY_ID=${{ github.run_id }}-${{ github.run_attempt }} COMPOSE_FILE=docker-compose.staging.yml bash scripts/deploy-images.sh

      - name: Wait for staging to be healthy
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 120
          max_attempts: 24
          retry_wait_seconds: 5
          command: |
            curl -sf ${{ secrets.STAGING_API_URL }}/monitoring/health

      - name: Staging smoke test
        run: |
          # Health check
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_API_URL }}/monitoring/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi

          # Readiness check
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_API_URL }}/monitoring/ready)
          if [ "$STATUS" != "200" ]; then
            echo "Readiness check failed with status $STATUS"
            exit 1
          fi

          echo "Staging smoke tests passed for image ${{ github.sha }}"

      - name: Rollback staging on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            DEPLOY_ID=${{ github.run_id }}-${{ github.run_attempt }} COMPOSE_FILE=docker-compose.staging.yml bash scripts/deploy-images.sh rollback

  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production }}
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Upload validated production configuration and scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: 'docker-compose.prod.yml,scripts/deploy-images.sh,scripts/db-backup.sh'
          target: ${{ secrets.PRODUCTION_DEPLOY_PATH }}

      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PRODUCTION_DEPLOY_PATH }}
            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}

            DEPLOY_ID=${{ github.run_id }}-${{ github.run_attempt }} COMPOSE_FILE=docker-compose.prod.yml bash scripts/deploy-images.sh

      - name: Wait for production health
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 180
          max_attempts: 36
          retry_wait_seconds: 5
          command: curl -sf ${{ secrets.PRODUCTION_API_URL }}/monitoring/ready

      - name: Rollback production on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PRODUCTION_DEPLOY_PATH }}
            DEPLOY_ID=${{ github.run_id }}-${{ github.run_attempt }} COMPOSE_FILE=docker-compose.prod.yml bash scripts/deploy-images.sh rollback
