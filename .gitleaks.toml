# gitleaks configuration
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "Ajust ERP gitleaks config"

[extend]
useDefault = true

# Allow CI test secrets, dev-only test values, and docs that mention sample env values
[allowlist]
description = "CI placeholders, dev-only test values, and documentation"
# Placeholders explícitos, não pastas inteiras: docs/, *.md e o ci.yml continuam
# varridos (um segredo colado num relatório ou no workflow precisa ser pego).
regexes = [
  '''ci_[a-z_]+_minimum_[a-z0-9_]+''',
  '''CiOnlyPassword@123''',
  '''dev-temporary-password-change-in-prod''',
  '''postgres:postgres@localhost''',
  '''postgresql://postgres:postgres@localhost''',
]
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.next[^/]*/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)test-results/''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''\.env\.example$''',
  '''\.env\.staging\.example$''',
  '''jest\.setup\.js$''',
  '''\.gitleaks\.toml$''',
]
